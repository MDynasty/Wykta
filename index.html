<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Wykta</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://wykta.pages.dev/">
  <link rel="canonical" href="https://wykta.pages.dev/">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }

    main {
      max-width: 420px;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting to Wykta</h1>
    <p>If you are not redirected automatically, <a id="redirectLink" href="https://wykta.pages.dev/">open wykta.pages.dev</a>.</p>
  </main>
  <script>
    const target = new URL(window.location.href)
    target.protocol = 'https:'
    target.hostname = 'wykta.pages.dev'
    target.port = ''

    const destination = target.toString()
    document.getElementById('redirectLink').href = destination
    window.location.replace(destination)
  </script>
</body>
</html>
